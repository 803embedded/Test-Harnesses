[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adapter-test"
version = "0.1.0"
description = "Post-assembly test harness for 803embedded Digi adapter boards (Toradex Viola + Colibri iMX6ULL)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "digi-xbee>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
adapter-test = "adapter_test.__main__:main"

[project.urls]
Repository = "https://github.com/803embedded/Test-Harnesses"
Issues = "https://github.com/803embedded/Test-Harnesses/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ARG"]

[tool.ruff.lint.per-file-ignores]
# Test doubles routinely take unused arguments to match a signature.
"tests/**" = ["ARG"]

[tool.mypy]
python_version = "3.10"
packages = ["adapter_test"]
mypy_path = "src"
strict = true

[[tool.mypy.overrides]]
module = "digi.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
